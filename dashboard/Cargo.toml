[package]
name = "ads-simulator-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ad-server = { path = "../ad-server" }
ads-marketplace-simulation = { path = "../simulation" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sim-agent = { path = "../sim-agent" }
simulation-analyzer = { path = "../simulation-analyzer" }
tempfile = "3"
world-generator = { path = "../world-generator" }
