<svg viewBox="0 0 756 468" width="756" height="468" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ads Simulator System Architecture">
  <style>
    :root {
      --canvas: #ffffff;
      --canvas-border: #d0d7de;
      --card: #ffffff;
      --surface: #f6f8fa;
      --pill-border: #d0d7de;
      --fg: #1f2328;
      --muted: #59636e;
      --edge: #656d76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0d1117;
        --canvas-border: #30363d;
        --card: #161b22;
        --surface: #161b22;
        --pill-border: #30363d;
        --fg: #e6edf3;
        --muted: #9198a1;
        --edge: #8b949e;
      }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .canvas { fill: var(--canvas); stroke: var(--canvas-border); stroke-width: 1; }
    .platform { fill: var(--surface); fill-opacity: 0.45; stroke: #10b981; stroke-width: 2; stroke-dasharray: 7 5; }
    .platform-badge { fill: var(--canvas); stroke: #10b981; stroke-width: 1.3; }
    .platform-label { fill: #10b981; font-size: 12px; font-weight: 600; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 2.4; }
    .arrow-head { fill: var(--edge); }
    .pill { fill: var(--canvas); stroke: var(--pill-border); stroke-width: 1; }
    .edge-label { fill: var(--muted); font-size: 12px; font-weight: 500; }
    .node-label { fill: var(--fg); font-size: 13.5px; font-weight: 600; }
    .node-env { fill: var(--card); stroke: #f59e0b; stroke-width: 2.2; }
    .node-corpus { fill: var(--card); stroke: #64748b; stroke-width: 2.2; }
    .node-pacing { fill: var(--card); stroke: #06b6d4; stroke-width: 2.2; }
    .node-online { fill: var(--card); stroke: #3b82f6; stroke-width: 2.2; }
    .node-training { fill: var(--card); stroke: #8b5cf6; stroke-width: 2.2; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0.5" y="0.5" width="755" height="467" rx="12" class="canvas" />

  <!-- Ads Platform dashed boundary -->
  <rect x="44" y="100" width="596" height="352" rx="14" class="platform" />
  <rect x="212" y="89" width="260" height="22" rx="11" class="platform-badge" />
  <text x="342" y="104" text-anchor="middle" class="platform-label">Ads Platform (observable signals only)</text>

  <!-- Connectors -->
  <!-- world-model -> user activity -->
  <path d="M 248 33 L 360 33" class="edge" marker-end="url(#arrow)" />
  <text x="304" y="24" text-anchor="middle" class="edge-label">preferences</text>

  <!-- user activity -> pacing -->
  <path d="M 412 52 L 412 63 Q 412 72 403 72 L 125 72 Q 116 72 116 81 L 116 248" class="edge" marker-end="url(#arrow)" />
  <rect x="200" y="62" width="108" height="20" rx="10" class="pill" />
  <text x="254" y="76" text-anchor="middle" class="edge-label">clicks &amp; spend</text>

  <!-- user activity -> ranking-training -->
  <path d="M 484 52 L 484 63 Q 484 72 493 72 L 529 72 Q 538 72 538 81 L 538 196" class="edge" marker-end="url(#arrow)" />
  <rect x="470" y="134" width="136" height="20" rx="10" class="pill" />
  <text x="538" y="148" text-anchor="middle" class="edge-label">browse &amp; click logs</text>

  <!-- ads-corpus -> pacing -->
  <path d="M 276 148 L 177 148 Q 168 148 168 157 L 168 248" class="edge" marker-end="url(#arrow)" />
  <text x="220" y="139" text-anchor="middle" class="edge-label">bids &amp; budgets</text>

  <!-- ads-corpus -> retrieval -->
  <path d="M 342 168 L 342 199" class="edge" marker-end="url(#arrow)" />
  <rect x="300" y="172" width="84" height="19" rx="9.5" class="pill" />
  <text x="342" y="185" text-anchor="middle" class="edge-label">candidates</text>

  <!-- Center spine: retrieval -> ranking -> auction -> serving -->
  <path d="M 342 242 L 342 262" class="edge" marker-end="url(#arrow)" />
  <path d="M 342 304 L 342 324" class="edge" marker-end="url(#arrow)" />
  <path d="M 342 366 L 342 386" class="edge" marker-end="url(#arrow)" />

  <!-- pacing -> auction -->
  <path d="M 142 298 L 142 339 Q 142 348 151 348 L 270 348" class="edge" marker-end="url(#arrow)" />
  <text x="206" y="339" text-anchor="middle" class="edge-label">paced bids</text>

  <!-- ranking-training -> ranking -->
  <path d="M 538 246 L 538 277 Q 538 286 529 286 L 414 286" class="edge" marker-end="url(#arrow)" />
  <text x="476" y="277" text-anchor="middle" class="edge-label">model</text>

  <!-- serving -> user activity -->
  <path d="M 408 410 L 687 410 Q 696 410 696 401 L 696 42 Q 696 33 687 33 L 536 33" class="edge" marker-end="url(#arrow)" />
  <rect x="649" y="214" width="94" height="20" rx="10" class="pill" />
  <text x="696" y="228" text-anchor="middle" class="edge-label">delivered ad</text>

  <!-- Nodes -->
  <!-- world-model -->
  <rect x="96" y="14" width="152" height="38" rx="19" class="node-env" />
  <text x="172" y="37" text-anchor="middle" class="node-label">world-model</text>

  <!-- user activity -->
  <rect x="366" y="14" width="164" height="38" rx="19" class="node-env" />
  <text x="448" y="37" text-anchor="middle" class="node-label">user activity</text>

  <!-- ads-corpus -->
  <path d="M 276 132 L 276 160 A 66 8 0 0 0 408 160 L 408 132 Z" class="node-corpus" />
  <ellipse cx="342" cy="132" rx="66" ry="8" class="node-corpus" />
  <text x="342" y="153" text-anchor="middle" class="node-label">ads-corpus</text>

  <!-- pacing -->
  <rect x="76" y="254" width="132" height="44" rx="8" class="node-pacing" />
  <text x="142" y="281" text-anchor="middle" class="node-label">pacing</text>

  <!-- retrieval -->
  <rect x="276" y="206" width="132" height="36" rx="8" class="node-online" />
  <text x="342" y="229" text-anchor="middle" class="node-label">retrieval</text>

  <!-- ranking -->
  <rect x="276" y="268" width="132" height="36" rx="8" class="node-online" />
  <text x="342" y="291" text-anchor="middle" class="node-label">ranking</text>

  <!-- auction -->
  <rect x="276" y="330" width="132" height="36" rx="8" class="node-online" />
  <text x="342" y="353" text-anchor="middle" class="node-label">auction</text>

  <!-- serving -->
  <rect x="276" y="392" width="132" height="36" rx="8" class="node-online" />
  <text x="342" y="415" text-anchor="middle" class="node-label">serving</text>

  <!-- ranking-training -->
  <rect x="464" y="202" width="148" height="44" rx="8" class="node-training" />
  <text x="538" y="229" text-anchor="middle" class="node-label">ranking-training</text>
</svg>
