[package]
name = "impression-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ad-server = { path = "../ad-server" }
ads-simulator = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
