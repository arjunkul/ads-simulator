[package]
name = "ads-marketplace-simulation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ads-ml = { path = "../ml" }
ads-simulator = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
